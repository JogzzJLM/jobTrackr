services:
  jobtrackr:
    build: .
    container_name: jobtrackr
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      APP_BASE_URL: "${APP_BASE_URL:-http://192.168.0.136:5001}"
      NTFY_TOPIC: "${NTFY_TOPIC:-applicationtrackr_alerts_har}"
      NTFY_BASE_URL: "${NTFY_BASE_URL:-https://ntfy.sh}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      JOBTRACKR_IMAP_HOST: "${JOBTRACKR_IMAP_HOST:-imap.gmail.com}"
      JOBTRACKR_IMAP_USER: "${JOBTRACKR_IMAP_USER:-}"
      JOBTRACKR_IMAP_PASSWORD: "${JOBTRACKR_IMAP_PASSWORD:-}"
      SCRAPER_INTERVAL_SECONDS: "${SCRAPER_INTERVAL_SECONDS:-300}"
      JOBTRACKR_PROFILE_JSON: "${JOBTRACKR_PROFILE_JSON:-}"
      GOOGLE_SHEET_EDIT_URL: "${GOOGLE_SHEET_EDIT_URL:-}"
      GOOGLE_SHEET_WEBHOOK_URL: "${GOOGLE_SHEET_WEBHOOK_URL:-}"
      GOOGLE_SHEET_SYNC_TOKEN: "${GOOGLE_SHEET_SYNC_TOKEN:-}"
      DATA_DIR: "/data"
      PYTHONUNBUFFERED: "1"
    volumes:
      - jobtrackr_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  jobtrackr_data:
