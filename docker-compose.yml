version: "3.8"

services:
  jobtrackr:
    build: .
    container_name: jobtrackr
    restart: unless-stopped

    ports:
      - "5001:5001"

    environment:
      PORT: "5001"
      APP_BASE_URL: "${APP_BASE_URL:-http://192.168.0.136:5001}"

      GMAIL_USER: "${GMAIL_USER:-}"
      GMAIL_APP_PASS: "${GMAIL_APP_PASS:-}"
      GOOGLE_SHEET_WEBHOOK_URL: "${GOOGLE_SHEET_WEBHOOK_URL:-}"
      HEALTHCHECKS_PING_URL: "${HEALTHCHECKS_PING_URL:-}"
      NTFY_TOPIC: "${NTFY_TOPIC:-}"

      DATA_DIR: "/data"
      PYTHONUNBUFFERED: "1"

    volumes:
      - jobtrackr_data:/data

volumes:
  jobtrackr_data:
