version: '3.8'

services:
  jobtrackr:
    build: .
    container_name: jobtrackr
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5001
      - HP_STREAM_TAILSCALE_IP=100.75.135.73
      - NTFY_TOPIC=jog_jobtrackr_alerts
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASS=${GMAIL_APP_PASS:-}
      - GOOGLE_SHEET_WEBHOOK_URL=${GOOGLE_SHEET_WEBHOOK_URL:-}
      - HEALTHCHECKS_PING_URL=${HEALTHCHECKS_PING_URL:-}
